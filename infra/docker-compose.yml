# Ethiopia Event Photo Sharing Platform - container topology (one container per service).
# Default profile: data plane only (Postgres, Redis, MinIO) for local development.
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
# Full stack:   add  --profile app       (migrate, api, worker, web, nginx)
# Antivirus:    add  --profile av        (ClamAV; required in production, AV_MODE=clamd)
# Monitoring:   add  --profile obs       (Prometheus + Grafana)
# Backups:      add  --profile ops       (daily encrypted pg_dump into the `backups` volume)
# Mobile APK:   docker compose -f infra/docker-compose.yml --env-file .env --profile mobile run --rm mobile-build   (-> dist/mobile)
# Production:   .env from ./infra/scripts/gen-secrets.sh (template .env.docker.example), TLS files in infra/nginx/certs.
# Local HTTP:   add  -f infra/docker-compose.local.yml  (development only: sandbox payments, fixed OTP).
# All of it must run on Ethiopia-hosted infrastructure in production (spec 14.2).
name: event-platform

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: *logging

x-api-env: &api-env
  NODE_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  CLAMD_HOST: clamav
  TRUST_PROXY: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-event}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-event_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-event}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued jobs survive a restart; noeviction so queues are never silently dropped.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redisdata:/data"]
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev_access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_change_me}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["miniodata:/data"]
    logging: *logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the three private buckets. No bucket is ever public.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_dev_access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_change_me}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/event-quarantine local/event-media local/event-exports &&
      mc anonymous set none local/event-quarantine &&
      mc anonymous set none local/event-media &&
      mc anonymous set none local/event-exports &&
      mc ilm rule add --expire-days 2 local/event-quarantine || true;
      mc ilm rule add --expire-days 3 local/event-exports || true;
      exit 0"

  clamav:
    profiles: ["av"]
    image: clamav/clamav:stable
    restart: unless-stopped
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamdb:/var/lib/clamav"]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s   # the first start downloads the signature database

  # One-shot schema migration (deployment step). api/worker wait for it.
  migrate:
    profiles: ["app"]
    <<: *hardening
    image: event-platform-api:latest
    build: { context: ../apps/api }
    depends_on:
      postgres: { condition: service_healthy }
    env_file: ${ENV_FILE:-../.env}
    environment:
      <<: *api-env
    command: ["node", "dist/scripts/migrate.js", "up"]
    restart: "no"

  api:
    profiles: ["app"]
    <<: *hardening
    image: event-platform-api:latest
    build: { context: ../apps/api }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy, required: false }
    env_file: ${ENV_FILE:-../.env}
    environment:
      <<: *api-env
      APP_ROLE: api
    expose: ["4000"]

  worker:
    profiles: ["app"]
    <<: *hardening
    image: event-platform-api:latest
    build: { context: ../apps/api }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy, required: false }
    env_file: ${ENV_FILE:-../.env}
    environment:
      <<: *api-env
      APP_ROLE: worker
    # Scale horizontally:  docker compose up -d --scale worker=3

  web:
    profiles: ["app"]
    <<: *hardening
    image: event-platform-web:latest
    # same-origin behind nginx -> CSP is 'self' only
    build: { context: ../apps/web, args: { API_INTERNAL_URL: "http://api:4000", CSP_API_ORIGINS: "" } }
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
    expose: ["3000"]

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/live || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:latest
    restart: unless-stopped
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-dev_only_metrics_token}
    # the committed config holds a placeholder; the real token is injected at start and never written to the repo
    entrypoint: ["/bin/sh", "-c", "sed \"s|REPLACE_WITH_METRICS_TOKEN|$$METRICS_TOKEN|\" /etc/prometheus/prometheus.tpl.yml > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.tpl.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3001:3000"]

  # Daily encrypted database backups (spec 18/24). Mirror /backups to the second Ethiopian site in production.
  backup:
    profiles: ["ops"]
    build: { context: ., dockerfile: backup/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-event}:${POSTGRES_PASSWORD:-event_dev_password}@postgres:5432/${POSTGRES_DB:-event}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_LOCATION_LABEL: ${BACKUP_LOCATION_LABEL:-primary-site}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
    volumes: ["backups:/backups"]
    logging: *logging

  # Android APK build (one-shot): docker compose --profile mobile run --rm mobile-build
  mobile-build:
    profiles: ["mobile"]
    image: event-platform-mobile-build:latest
    build:
      context: ../apps/mobile
      args:
        API_BASE: ${PUBLIC_API_URL:-https://photos.example.et}
        WEB_HOST: ${MOBILE_WEB_HOST:-photos.example.et}
    volumes: ["../dist/mobile:/out"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamdb:
  promdata:
  backups:
