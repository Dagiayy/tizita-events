global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: REPLACE_WITH_METRICS_TOKEN   # inject from the secret store at deploy time; never commit the real token
    static_configs:
      - targets: ['api:4000']
        labels: { role: api }
  - job_name: worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: REPLACE_WITH_METRICS_TOKEN
    static_configs:
      - targets: ['worker:4000']
        labels: { role: worker }
