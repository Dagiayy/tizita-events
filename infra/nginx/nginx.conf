# Edge: TLS termination, request limits, routing. Runs on Ethiopia-hosted infrastructure.
# Certificates: place fullchain.pem / privkey.pem in infra/nginx/certs (never commit them).
worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main_json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,"rid":"$request_id"}';
  access_log /var/log/nginx/access.log main_json;

  # Abuse protection at the edge (the API enforces its own per-session / per-phone limits too)
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=upload:20m rate=60r/s;   # chunk uploads: many small PUTs from venue Wi-Fi NAT
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server api:4000; keepalive 32; }
  upstream web { server web:3000; keepalive 16; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;       # private events are never indexed (D14)
    client_max_body_size 2m;
    limit_conn conn 40;

    # chunked photo uploads (1 MiB chunks) go straight to the API upload gateway
    location /v1/uploads/ {
      limit_req zone=upload burst=200 nodelay;
      client_max_body_size 2m;
      client_body_timeout 120s;
      proxy_request_buffering on;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $request_id;
    }

    location /v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $request_id;
    }

    # live gallery (SSE): no buffering, long read timeout
    location /v1/live {
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_buffering off; proxy_cache off; proxy_read_timeout 1900s; chunked_transfer_encoding off;
      proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }

    # payment provider callbacks keep the raw body untouched
    location /v1/payments/callbacks/ {
      proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $request_id;
    }

    # health/metrics are internal-only
    location /health/ { proxy_pass http://api; }
    location /metrics { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; proxy_pass http://api; }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
