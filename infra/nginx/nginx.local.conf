# LOCAL/DEV ONLY: plain-HTTP edge for `docker compose -f infra/docker-compose.yml -f infra/docker-compose.local.yml`. Production uses nginx.conf (TLS).
worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  include /etc/nginx/mime.types;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream api { server api:4000; }
  upstream web { server web:3000; }
  server {
    listen 80;
    client_max_body_size 2m;
    location /v1/live { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_read_timeout 1900s; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /v1/ { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health/ { proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
