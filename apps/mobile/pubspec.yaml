name: event_photos
description: "Ethiopia Event Photo Sharing - Android capture app (queue, retry, background upload)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^6.1.4
  image_picker: ^1.2.3
  camera: ^0.12.1
  mobile_scanner: ^7.4.2
  app_links: ^7.2.1
  workmanager: ^0.10.10
  flutter_local_notifications: ^19.0.0
  flutter_image_compress: ^2.5.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  uuid: ^4.6.0
  web: ^1.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
  generate: true   # gen-l10n: lib/l10n/app_en.arb + app_am.arb (every UI string comes from localization resources)
